name: Sync Apple bezels

on:
  schedule:
    # First Tuesday-ish of each month, 14:00 UTC — after most Apple events settle.
    - cron: '0 14 3 * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Restrict the run to sources matching this pattern (--only)'
        required: false
        default: ''
      force:
        description: 'Re-fetch/re-import sources matching this pattern (--force; exercises download + extraction even when nothing changed upstream)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

env:
  # The sync path never launches a browser (measurement is pure Node), so skip
  # the Playwright browser download that `npm ci` would otherwise trigger. The
  # browser-based e2e suites skip themselves when no Chromium is installed;
  # they run for real in ci.yml on the PR this workflow opens.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  sync:
    # DMG extraction on Linux uses official 7-Zip (7zz ≥21 reads APFS/HFS+
    # DMGs directly and never sees the embedded click-through license);
    # macOS would use hdiutil — see tools/sync-bezels.mjs extractDMG().
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install 7-Zip (DMG extractor)
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip
          7zz | head -2   # verify availability + version (need ≥21 for APFS)

      - name: Install deps
        run: npm ci

      - name: Discover + refresh managed bezels
        id: sync
        env:
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          set -o pipefail
          ARGS=()
          [ -n "$ONLY" ] && ARGS+=(--only "$ONLY")
          [ -n "$FORCE" ] && ARGS+=(--force "$FORCE")
          node tools/sync-bezels.mjs "${ARGS[@]}" | tee /tmp/sync-report.txt
          # expose whether anything changed
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain static/devices src/lib)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + test with refreshed bezels
        if: steps.sync.outputs.changed == 'true'
        run: |
          npm test
          npm run build

      - name: Open PR with changes
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="bezel-sync/$(date +%Y-%m)"
          git config user.name "monkr-bezel-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add static/devices src/lib docs README.md 2>/dev/null || true
          {
            echo "Bezel sync: refresh from Apple Design Resources"
            echo
            echo "Automated monthly sync. Review the report below; new device CLASSES"
            echo "need a human-confirmed ASC display-type mapping before screenshot use."
            echo
            tail -40 /tmp/sync-report.txt
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          # force: the month's bot branch may exist from an earlier run/rerun
          git push -u --force origin "$BRANCH"
          gh pr create --fill --body-file /tmp/sync-report.txt || true

      - name: Report (no changes)
        if: steps.sync.outputs.changed != 'true'
        run: echo "No bezel changes this month." && tail -20 /tmp/sync-report.txt
