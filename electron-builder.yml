appId: com.monkr.lite.portable
productName: DemoPNG-local
asar: true
electronDist: node_modules/electron/dist
files:
  - build/**/*
  - desktop/**/*
  - static/icon-512.png
  - package.json
directories:
  output: release
win:
  icon: static/icon-512.png
  target:
    - target: portable
      arch: [x64]
  signAndEditExecutable: true
portable:
  artifactName: DemoPNG-local-Windows-${version}-${arch}.${ext}

mac:
  icon: static/icon-512.png
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: DemoPNG-local-macOS-${version}-${arch}.${ext}
